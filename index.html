<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certiverse Proctor Hub — Canned Messages</title>
<style>
  :root[data-theme="dark"]{
    --bg:#0F1419;
    --panel:#161C25;
    --panel-2:#1C232E;
    --border:#2A323D;
    --text:#E8EAED;
    --text-dim:#8B95A1;
    --text-faint:#5B6470;
    --accent:#4FD1C5;
    --accent-dim:#2B4A47;
    --amber:#F0A868;
    --amber-dim:#4A3A22;
    --red:#E8636F;
    --red-dim:#4A2429;
    --green:#6FCF97;
    --scrollbar:#2A323D;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#F5F6F8;
    --panel:#FFFFFF;
    --panel-2:#F0F2F5;
    --border:#DCE0E6;
    --text:#1B2430;
    --text-dim:#5B6470;
    --text-faint:#8B95A1;
    --accent:#0F9E90;
    --accent-dim:#DFF4F1;
    --amber:#B5720A;
    --amber-dim:#FBEBD7;
    --red:#C93A46;
    --red-dim:#FBE2E4;
    --green:#2E9E5B;
    --scrollbar:#D5D9DF;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html{ background:var(--bg); }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .15s ease, color .15s ease;
  }
  .topbar{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 96%, transparent);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    transition:background .15s ease, border-color .15s ease;
  }
  .topbar-inner{ max-width:980px; margin:0 auto; }
  .title-row{
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .dot{
    width:8px; height:8px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim);
    flex-shrink:0;
  }
  .dot.editing{ background:var(--amber); box-shadow:0 0 0 3px var(--amber-dim); }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px; font-weight:600; letter-spacing:0.04em;
    text-transform:uppercase; margin:0; color:var(--text);
  }
  .subtitle{
    font-size:12px; color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
  }
  .spacer{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .edit-toggle, .theme-toggle{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .edit-toggle:hover, .theme-toggle:hover{ border-color:var(--text-faint); color:var(--text); }
  .edit-toggle.active{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }
  .theme-toggle .icon{ font-size:13px; line-height:1; }
  .save-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--text-faint);
    white-space:nowrap;
  }
  .save-status.saving{ color:var(--amber); }
  .save-status.saved{ color:var(--green); }
  .storage-note{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; color:var(--text-faint);
    white-space:nowrap;
  }
  .search-wrap{ position:relative; }
  #search{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-size:15px;
    padding:12px 44px 12px 40px;
    border-radius:8px;
    outline:none;
    font-family:'IBM Plex Mono',monospace;
  }
  #search:focus{ border-color:var(--accent); }
  #search::placeholder{ color:var(--text-faint); }
  .search-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); font-size:15px; pointer-events:none;
  }
  .kbd-hint{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    font-size:11px; color:var(--text-faint);
    border:1px solid var(--border); border-radius:4px; padding:2px 6px;
    font-family:'IBM Plex Mono',monospace;
    pointer-events:none;
  }
  .category-scroller{
    max-width:980px; margin:12px auto 0;
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:thin;
    align-items:center;
  }
  .cat-pill{
    flex-shrink:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .12s ease;
  }
  .cat-pill:hover{ border-color:var(--text-faint); color:var(--text); }
  .cat-pill.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .cat-pill.add-cat{ color:var(--accent); border-style:dashed; }

  main{ max-width:980px; margin:0 auto; padding:18px 20px 80px; }
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
  }
  .section-heading{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--text-faint);
    margin:28px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .section-heading:first-child{ margin-top:0; }
  .section-heading .num{
    color:var(--accent);
  }
  .add-msg-btn{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--accent);
    background:var(--accent-dim);
    border:1px solid var(--accent);
    padding:3px 9px;
    border-radius:5px;
    cursor:pointer;
    text-transform:none;
    letter-spacing:normal;
  }
  .del-cat-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--red);
    background:var(--red-dim);
    border:1px solid var(--red);
    padding:3px 9px;
    border-radius:5px;
    cursor:pointer;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:3px solid var(--border);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .card:hover{ background:var(--panel-2); border-left-color:var(--accent); }
  .card.copied{ border-left-color:var(--green); }
  .card.cat-warning{ border-left-color:var(--amber); }
  .card.cat-warning:hover{ border-left-color:var(--amber); background:var(--amber-dim); }
  .card.cat-termination{ border-left-color:var(--red); }
  .card.cat-termination:hover{ border-left-color:var(--red); background:var(--red-dim); }
  .card.editing-item{ cursor:default; }

  .card-body{ flex:1; min-width:0; }
  .card-text{ font-size:14.5px; line-height:1.5; color:var(--text); white-space:pre-wrap; }
  .card-meta{
    display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--accent);
    background:var(--accent-dim);
    padding:2px 8px;
    border-radius:10px;
  }
  .os-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-dim);
    border:1px solid var(--border);
    padding:1px 6px;
    border-radius:4px;
    letter-spacing:0.03em;
  }
  .copy-btn, .icon-btn{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:6px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    cursor:pointer;
  }
  .card:hover .copy-btn{ color:var(--accent); border-color:var(--accent); }
  .card.copied .copy-btn{ color:var(--green); border-color:var(--green); }
  .icon-btn.edit-icon:hover{ color:var(--accent); border-color:var(--accent); }
  .icon-btn.del-icon:hover{ color:var(--red); border-color:var(--red); }
  .card-actions{ display:flex; flex-direction:column; gap:6px; }

  .edit-textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--accent);
    color:var(--text);
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    border-radius:6px;
    padding:8px 10px;
    resize:vertical;
    min-height:60px;
  }
  .edit-row{ display:flex; gap:8px; margin-top:8px; }
  .edit-row input{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:4px 8px;
    border-radius:5px;
  }
  .edit-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text-dim);
  }
  .edit-btn.primary{ color:var(--accent); border-color:var(--accent); background:var(--accent-dim); }
  .edit-btn.danger{ color:var(--red); border-color:var(--red); background:var(--red-dim); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--green); color:var(--green);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    padding:10px 18px; border-radius:8px;
    opacity:0; pointer-events:none;
    transition:all .18s ease;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
  }

  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--scrollbar); border-radius:3px; }

  @media (max-width:600px){
    h1{ font-size:12px; }
    .subtitle{ display:none; }
    .storage-note{ display:none; }
  }

  .primary-tabs{display:flex;gap:8px;margin:10px 0 0;}
  .primary-tab{font-family:inherit;font-size:13px;font-weight:600;color:var(--text-dim);background:var(--panel);border:1px solid var(--border);padding:8px 14px;border-radius:8px;cursor:pointer;}
  .primary-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  #processFlowView{display:none;padding:18px 20px 40px;max-width:1020px;margin:0 auto;}
  #processFlowFrame{display:block;width:100%;height:calc(100vh - 190px);min-height:780px;border:1px solid var(--border);border-radius:8px;background:#fff;}

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="title-row">
      <span class="dot" id="statusDot"></span>
      <h1>Certiverse Proctor Hub</h1>
      <span class="subtitle">Canned Messages</span>
      <div class="spacer">
        <span class="storage-note" id="storageNote"></span>
        <span class="save-status" id="saveStatus"></span>
        <div class="theme-toggle" id="themeToggle"><span class="icon" id="themeIcon">☾</span><span id="themeLabel">Dark</span></div>
        <div class="edit-toggle" id="editToggle">Edit</div>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" type="text" placeholder="Type # for a shortcut, or search by keyword…" autocomplete="off">
      <span class="kbd-hint">/</span>
    </div>
    <div class="primary-tabs" role="tablist" aria-label="Main sections">
      <button type="button" class="primary-tab active" id="sebTab" role="tab" aria-selected="true">SEB</button>
      <button type="button" class="primary-tab" id="nonSebTab" role="tab" aria-selected="false">Non-SEB</button>
      <button type="button" class="primary-tab" id="miscTab" role="tab" aria-selected="false">Miscellaneous</button>
      <button type="button" class="primary-tab" id="processTab" role="tab" aria-selected="false">Process Flow</button>
    </div>
    <div class="category-scroller" id="catScroller"></div>
    <div class="category-scroller" id="flowScroller" style="display:none" aria-label="Process Flow subtabs"></div>
  </div>
</div>

<main id="main"><div class="loading-state">Loading messages…</div></main>
<div id="processFlowView"><iframe id="processFlowFrame" title="Proctor Process Flows"></iframe></div>

<div class="toast" id="toast">Copied to clipboard</div>

<script>
const DEFAULT_DATA = [
  {cat:"1", catName:"Welcome", color:"", items:[

    {tag:"hold", text:"Please hold while we prepare your exam. Thank you for waiting."},
  ]},
  {cat:"2", catName:"Identification Verification", color:"", items:[

    {tag:"sys-closetab", os:"ALL", text:"Please also close the other Certiverse tab, leaving only this one open."},
    {tag:"sys-taskmgr", os:"WINDOWS", text:"Please open your Task Manager. Then, scroll down slowly until you reach the end of the list."},
    {tag:"sys-systray", os:"WINDOWS", text:"Please open your System Tray by clicking the arrow icon (^) at the bottom-right corner of your taskbar. Right-click each application and close any that offers a 'Quit' or 'Exit' option."},

  {cat:"4", catName:"Clear Desk", color:"", items:[

    {tag:"desk-electronics", text:"Ensure all electronic devices are put away and out of reach. This includes phones, smartwatches, headphones, smart glasses, and any other electronic device."},
    {tag:"desk-headphones", text:"Headphones are not allowed during the exam. Please remove them and put them away."},
    {tag:"desk-hat", text:"Hats are not allowed during the exam. Please remove your hat and put it away."},

  {cat:"5", catName:"Room Scan", color:"", items:[

    {tag:"scan-hold", text:"When doing the room scan, please hold your laptop in a way that allows the camera to clearly capture the room. Rotate it slowly and make sure nothing blocks the view, so I can see all areas of your workspace, including the desk, floor, walls, and surrounding environment."},

  {cat:"9", catName:"Technical Support", color:"", items:[
    {tag:"tech-camswitch", text:"Please check for a camera switch or button on your device. Some laptops have a physical switch that turns the camera on or off. If your laptop has one, make sure it is in the on position before using your camera. Otherwise, please check if your camera has a sliding cover and slide it open."},

    {tag:"tech-reboot", text:"Please try to reboot your machine and launch the exam again."},
    {tag:"tech-relaunch", text:"Seems like you are experiencing issues with your session. Can you please close this browser and relaunch your session from the exam dashboard?"},

    {tag:"tech-internet", text:"It seems that you are having internet issues. We can cancel this reservation so you can reschedule the exam when you can use a more reliable network."},

    {tag:"tech-docking", text:"Are you currently using a docking station?"},

    {tag:"tech-contactsupport", text:"It seems like the problem persists. Please contact support@certiverse.com so they can help you complete your setup before we begin the exam."},
    {tag:"tech-30min", text:"You will have up to 30 minutes to reconnect. Your previous answers will be saved. If it takes more than 30 minutes, the exam will be automatically submitted. Please contact support@certiverse.com for further assistance if needed."},

  {cat:"11", catName:"Non-SEB Exams", color:"", items:[
    {tag:"nonseb-fullscreen", text:"Click on the 'Enter Full Screen' button that you will find in the bottom center of the screen after you hide this chat."},
    {tag:"nonseb-popup", text:"You may hide or move the pop-up screen-sharing message at the bottom center of your screen."},
  ]},

const STORAGE_KEY = 'certiverse-canned-messages';
const THEME_KEY = 'certiverse-proctor-hub-theme';

// --- Storage adapter -------------------------------------------------
// Uses window.storage (Claude artifact persistence) when it's available.
// Falls back to localStorage so this file also works as a plain static
// page — e.g. hosted on GitHub Pages — where window.storage doesn't exist.
// In the localStorage fallback, data is per-browser only (not shared
// across visitors), since there's no backend to sync it through.
const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage;

const localAdapter = {
  async get(key){
    const raw = localStorage.getItem(key);
    return raw === null ? null : { key, value: raw };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  }
};

const storageAdapter = hasCloudStorage ? window.storage : localAdapter;

let DATA = [];
let activeCat = 'all';
let activeMainTab = 'seb';
const GROUPS = {seb:['1','2','3','4','5','6','13'], nonseb:['1','2','3','4','5','6','11'], misc:['7','8','9','12']};
let isEditMode = false;
let editingItemKey = null; // "cat|tag" currently being edited inline
let theme = 'dark';

const main = document.getElementById('main');
const searchInput = document.getElementById('search');
const catScroller = document.getElementById('catScroller');
const toast = document.getElementById('toast');
const editToggle = document.getElementById('editToggle');
const saveStatus = document.getElementById('saveStatus');
const statusDot = document.getElementById('statusDot');
const storageNote = document.getElementById('storageNote');
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');

storageNote.textContent = hasCloudStorage ? 'synced' : 'saved on this device';

// --- Theme ------------------------------------------------------------
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  const isDark = theme === 'dark';
  themeIcon.textContent = isDark ? '☾' : '☀';
  themeLabel.textContent = isDark ? 'Dark' : 'Light';
}

async function loadTheme(){
  let saved = null;
  try{
    // theme is a personal display preference, stored non-shared
    const result = (hasCloudStorage
      ? await storageAdapter.get(THEME_KEY, false)
      : await storageAdapter.get(THEME_KEY));
    saved = result && result.value ? result.value : null;
  }catch(e){
    saved = null;
  }
  if(saved === 'light' || saved === 'dark'){
    theme = saved;
  } else {
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  applyTheme();
}

async function saveTheme(){
  try{
    if(hasCloudStorage){ await storageAdapter.set(THEME_KEY, theme, false); }
    else{ await storageAdapter.set(THEME_KEY, theme); }
  }catch(e){}
}

themeToggle.addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  saveTheme();
});

async function loadData(){
  try{
    const result = await storageAdapter.get(STORAGE_KEY, true);
    DATA = result && result.value ? JSON.parse(result.value) : null;
  }catch(e){
    DATA = null;
  }
  if(!DATA){
    DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
    try{ await storageAdapter.set(STORAGE_KEY, JSON.stringify(DATA), true); }catch(e){}
  }
  buildCatPills();
  render();
}

async function saveData(){
  saveStatus.textContent = 'Saving…';
  saveStatus.className = 'save-status saving';
  try{
    await storageAdapter.set(STORAGE_KEY, JSON.stringify(DATA), true);
    saveStatus.textContent = 'Saved';
    saveStatus.className = 'save-status saved';
    setTimeout(() => { if(saveStatus.textContent === 'Saved') saveStatus.textContent = ''; }, 1600);
  }catch(e){
    saveStatus.textContent = 'Save failed — try again';
    saveStatus.className = 'save-status';
  }
}

function buildCatPills(){
  catScroller.innerHTML = '';
  const allPill = document.createElement('div');
  allPill.className = 'cat-pill' + (activeCat === 'all' ? ' active' : '');
  allPill.textContent = 'All';
  allPill.dataset.cat = 'all';
  catScroller.appendChild(allPill);
  DATA.filter(section => (GROUPS[activeMainTab] || []).includes(section.cat)).forEach(section => {
    const pill = document.createElement('div');
    pill.className = 'cat-pill' + (activeCat === section.cat ? ' active' : '');
    pill.textContent = section.cat + '. ' + section.catName;
    pill.dataset.cat = section.cat;
    catScroller.appendChild(pill);
  });
  if(isEditMode){
    const addPill = document.createElement('div');
    addPill.className = 'cat-pill add-cat';
    addPill.textContent = '+ Category';
    addPill.addEventListener('click', addCategory);
    catScroller.appendChild(addPill);
  }
}

catScroller.addEventListener('click', e => {
  const pill = e.target.closest('.cat-pill');
  if(!pill || pill.classList.contains('add-cat')) return;
  activeCat = pill.dataset.cat;
  [...catScroller.children].forEach(c => c.classList.toggle('active', c === pill));
  render();
});

function matches(item, query){
  if(!query) return true;
  const q = query.replace(/^#/, '').toLowerCase().trim();
  if(!q) return true;
  return item.tag.toLowerCase().includes(q) || item.text.toLowerCase().includes(q);
}

function render(){
  const query = searchInput.value;
  main.innerHTML = '';
  let anyResults = false;

  DATA.forEach(section => {
    if(!(GROUPS[activeMainTab] || []).includes(section.cat)) return;
    if(activeCat !== 'all' && section.cat !== activeCat) return;
    const filteredItems = section.items.filter(item => matches(item, query));
    if(filteredItems.length === 0 && !(isEditMode && activeCat === section.cat)) return;
    anyResults = true;

    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.innerHTML = `<span class="num">${section.cat}</span> ${section.catName}${section.note ? ' <span class="tag" style="margin-left:4px">'+section.note+'</span>' : ''}`;
    if(isEditMode){
      const addBtn = document.createElement('div');
      addBtn.className = 'add-msg-btn';
      addBtn.textContent = '+ Message';
      addBtn.addEventListener('click', () => addItem(section));
      heading.appendChild(addBtn);
      const delCatBtn = document.createElement('div');
      delCatBtn.className = 'del-cat-btn';
      delCatBtn.textContent = 'Delete category';
      delCatBtn.addEventListener('click', () => deleteCategory(section));
      heading.appendChild(delCatBtn);
    }
    main.appendChild(heading);

    filteredItems.forEach(item => {
      const key = section.cat + '|' + item.tag;
      const card = document.createElement('div');
      card.className = 'card' + (section.color === 'warning' ? ' cat-warning' : '') + (section.color === 'termination' ? ' cat-termination' : '');

      if(isEditMode && editingItemKey === key){
        card.classList.add('editing-item');
        const body = document.createElement('div');
        body.className = 'card-body';

        const textarea = document.createElement('textarea');
        textarea.className = 'edit-textarea';
        textarea.value = item.text;
        body.appendChild(textarea);

        const row = document.createElement('div');
        row.className = 'edit-row';
        const tagInput = document.createElement('input');
        tagInput.placeholder = 'tag';
        tagInput.value = item.tag;
        row.appendChild(tagInput);
        const osInput = document.createElement('input');
        osInput.placeholder = 'OS badge (optional)';
        osInput.value = item.os || '';
        row.appendChild(osInput);
        body.appendChild(row);

        const actions = document.createElement('div');
        actions.className = 'edit-row';
        const saveBtn = document.createElement('div');
        saveBtn.className = 'edit-btn primary';
        saveBtn.textContent = 'Save';
        saveBtn.addEventListener('click', async () => {
          item.text = textarea.value.trim() || item.text;
          item.tag = tagInput.value.trim() || item.tag;
          item.os = osInput.value.trim() || undefined;
          editingItemKey = null;
          await saveData();
          render();
        });
        const cancelBtn = document.createElement('div');
        cancelBtn.className = 'edit-btn';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', () => { editingItemKey = null; render(); });
        const deleteBtn = document.createElement('div');
        deleteBtn.className = 'edit-btn danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', async () => {
          if(!confirm('Delete this message?')) return;
          section.items = section.items.filter(i => i !== item);
          editingItemKey = null;
          await saveData();
          render();
        });
        actions.appendChild(saveBtn);
        actions.appendChild(cancelBtn);
        actions.appendChild(deleteBtn);
        body.appendChild(actions);

        card.appendChild(body);
        main.appendChild(card);
        return;
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const text = document.createElement('div');
      text.className = 'card-text';
      text.textContent = item.text;
      body.appendChild(text);

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '#' + item.tag;
      meta.appendChild(tag);
      if(item.os){
        const osBadge = document.createElement('span');
        osBadge.className = 'os-badge';
        osBadge.textContent = item.os;
        meta.appendChild(osBadge);
      }
      body.appendChild(meta);

      card.appendChild(body);

      if(isEditMode){
        const actions = document.createElement('div');
        actions.className = 'card-actions';
        const editBtn = document.createElement('div');
        editBtn.className = 'icon-btn edit-icon';
        editBtn.textContent = '✎';
        editBtn.title = 'Edit';
        editBtn.addEventListener('click', ev => { ev.stopPropagation(); editingItemKey = key; render(); });
        const delBtn = document.createElement('div');
        delBtn.className = 'icon-btn del-icon';
        delBtn.textContent = '🗑';
        delBtn.title = 'Delete';
        delBtn.addEventListener('click', async ev => {
          ev.stopPropagation();
          if(!confirm('Delete this message?')) return;
          section.items = section.items.filter(i => i !== item);
          await saveData();
          render();
        });
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        card.appendChild(actions);
      } else {
        const btn = document.createElement('div');
        btn.className = 'copy-btn';
        btn.textContent = '⧉';
        card.appendChild(btn);
        card.addEventListener('click', () => copyMessage(item.text, card));
      }

      main.appendChild(card);
    });
  });

  if(!anyResults){
    main.innerHTML = '<div class="empty-state">No messages match that search. Try a different keyword or shortcut.</div>';
  }
}

async function addItem(section){
  const text = prompt('New message text:');
  if(text === null || text.trim() === '') return;
  const tag = prompt('Short tag for this message (used for search, e.g. "welcome-new"):', '');
  section.items.push({tag: (tag || 'new-message').trim(), text: text.trim()});
  await saveData();
  render();
}

async function addCategory(){
  const id = prompt('Category number/id (e.g. 14):');
  if(id === null || id.trim() === '') return;
  if(DATA.some(s => s.cat === id.trim())){
    alert('A category with that id already exists.');
    return;
  }
  const name = prompt('Category name (e.g. "Escalations"):');
  if(name === null || name.trim() === '') return;
  DATA.push({cat: id.trim(), catName: name.trim(), color:'', items: []});
  activeCat = id.trim();
  await saveData();
  buildCatPills();
  render();
}

async function deleteCategory(section){
  if(!confirm(`Delete the "${section.catName}" category and all ${section.items.length} message(s) in it?`)) return;
  DATA = DATA.filter(s => s !== section);
  if(activeCat === section.cat) activeCat = 'all';
  await saveData();
  buildCatPills();
  render();
}

function copyMessage(text, card){
  navigator.clipboard.writeText(text).then(() => {
    showToast();
    card.classList.add('copied');
    setTimeout(() => card.classList.remove('copied'), 700);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  });
}

let toastTimer;
function showToast(){
  clearTimeout(toastTimer);
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}

searchInput.addEventListener('input', render);

document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault();
    searchInput.focus();
  }
  if(e.key === 'Escape'){
    searchInput.value = '';
    searchInput.blur();
    render();
  }
});

// --- Edit mode toggle (no passcode — anyone viewing the page can edit) ---
editToggle.addEventListener('click', () => {
  isEditMode = !isEditMode;
  if(!isEditMode) editingItemKey = null;
  updateEditUI();
  buildCatPills();
  render();
});

function updateEditUI(){
  editToggle.classList.toggle('active', isEditMode);
  editToggle.textContent = isEditMode ? 'Editing — tap to lock' : 'Edit';
  statusDot.classList.toggle('editing', isEditMode);
}

loadTheme();
loadData();

x; }\n.process-subtab { border:1px solid #cbd7e1; background:#fff; color:#173b57; padding:10px 14px; border-radius:7px; font-weight:700; cursor:pointer; }\n.process-subtab:hover { background:#eaf3f9; }\n.process-subtab.active { background:#173b57; color:#fff; border-color:#173b57; }\n@media (max-width:650px) { .process-subtabs { padding:0 12px; } .process-subtab { flex:1 1 100%; text-align:left; } }\n.policy-panel { background:#fff; border:1px solid #d7e0e8; border-radius:12px; padding:22px; margin:0 auto 24px; max-width:1000px; }\n.policy-panel h2 { margin-top:0; color:#173b57; }\n.search-box { width:100%; padding:11px 12px; margin:12px 0 16px; border:1px solid #b9c8d5; border-radius:7px; font-size:16px; }\n.policy-table { width:100%; border-collapse:collapse; background:#fff; }\n.policy-table th,.policy-table td { text-align:left; padding:11px 12px; border:1px solid #d7e0e8; }\n.policy-table th { background:#eaf3f9; color:#173b57; }\n.status-locked { display:inline-block; font-weight:700; white-space:nowrap; }\n.policy-note { background:#fff5d8; border:1px solid #ead89a; border-radius:8px; padding:14px; margin:16px 0; }\n@media(max-width:650px){.policy-panel{padding:14px;overflow-x:auto}.policy-table{min-width:400px}}\n<\/style>\n<style>\n/* Click-to-copy messages for proctors */\n.action.copy-message { cursor: pointer; position: relative; padding-top: 43px; transition: border-color .15s, background .15s; }\n.template.copy-message { cursor: pointer; position: relative; padding-top: 43px; transition: border-color .15s, background .15s; }\n.template.copy-message:hover, .template.copy-message:focus { border-color: #2d7fb8; background: #edf7ff; outline: 2px solid #b8dcf5; outline-offset: 1px; }\n.template.copy-message::before { content: 'CLICK TO COPY'; position: absolute; top: 10px; left: 12px; display: inline-block; padding: 4px 8px; border-radius: 4px; background: #173b57; color: white; font-size: 10px; font-weight: bold; letter-spacing: .5px; }\n.template.copy-message.copied::before { content: 'COPIED — PASTE WITH CTRL+V'; background: #176438; }\n.action.copy-message:hover, .action.copy-message:focus { border-color: #2d7fb8; background: #edf7ff; outline: 2px solid #b8dcf5; outline-offset: 1px; }\n.action.copy-message::before { content: 'CLICK TO COPY'; position: absolute; top: 10px; left: 12px; display: inline-block; padding: 4px 8px; border-radius: 4px; background: #173b57; color: white; font-size: 10px; font-weight: bold; letter-spacing: .5px; }\n.action.copy-message.copied::before { content: 'COPIED — PASTE WITH CTRL+V'; background: #176438; }\n<\/style>\n<\/head>\n\n<body>\n\n<header>\n  <h1>Proctor Process Flows<\/h1>\n  <p>Process Flows and Escalation Procedures<\/p>\n<\/header>\n\n<main>\n\n<div class=\"intro\">\n  <h2>How to Use This Guide<\/h2>\n  <p>Follow the steps in order. Check the test taker's situation, choose the correct YES or NO path, and follow the instructions.<\/p>\n  <div class=\"note\">\n    <strong>Important:<\/strong> Follow the applicable exam policy and CS/Manager on Duty instructions. Do not manually cancel or END a session unless authorized by the applicable process.\n     <p><strong>Reminder:<\/strong><\/p>\n    <ul style=\"margin: 8px 0 0; padding-left: 28px; list-style-type: disc;\">\n      <li>Follow the process in order.<\/li>\n      <li>Use the provided messages.<\/li>\n      <li>Hide all PII in screenshots.<\/li>\n      <li>Document actions and notify CS when required.<\/li>\n      <li>Follow the applicable cancellation and Proctor Hub closure rules.<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n\n<section class=\"policy-panel\" id=\"client-policy-panel\" hidden>\n  <h2>Client Name-Change Policy<\/h2>\n  <p>Use this table when a test taker’s name on their government-issued ID does not match the reservation. The status is locked reference information; do not change it based on a proctor’s judgment.<\/p>\n  <input class=\"search-box\" id=\"clientSearch\" type=\"search\" placeholder=\"Search client name…\" aria-label=\"Search clients\">\n  <table class=\"policy-table\" id=\"clientPolicyTable\">\n    <thead><tr><th scope=\"col\">Client<\/th><th scope=\"col\">Name change allowed? (locked)<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>Atlassian<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>BluePrism<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>BMC<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>Braze<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>Camunda<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>CASBO<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>CIW/Certification Partners<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>Collibra<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>Docusign<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>F5 Certified<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>HashiCorp<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>InterSystems<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>Moody's<\/td><td><span class=\"status-locked\">🔒 Unknown<\/span><\/td><\/tr>\n      <tr><td>NRPP<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>NVIDIA<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>OpenText<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>Project Success<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>ProofPoint<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>Stripe<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>Toast<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>Webflow<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n      <tr><td>WellSky<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>WindRiver<\/td><td><span class=\"status-locked\">🔒 Yes<\/span><\/td><\/tr>\n      <tr><td>Zscaler<\/td><td><span class=\"status-locked\">🔒 No<\/span><\/td><\/tr>\n    <\/tbody>\n  <\/table>\n  <div class=\"policy-note\"><strong>For Moody's — status Unknown:<\/strong> Do not assume a name change is allowed or prohibited. Contact CS or the Manager on Duty and follow their direction before taking action.<\/div>\n  <p><strong>If name change is allowed:<\/strong> Notify CS and follow the approved name-change process. Wait for confirmation, refresh the dashboard, verify the updated reservation, and inform the test taker.<\/p>\n  <p><strong>If name change is not allowed:<\/strong> Inform the test taker that the session must be canceled, request confirmation, capture the chat history with PII hidden, and request manual cancellation from CS or the Manager on Duty as applicable.<\/p>\n<\/section>\n\n<!-- PROCESS 1: COMMON TO SEB AND NON-SEB -->\n<section data-platform=\"both\" data-flow=\"1\">\n<div class=\"section-title\">\n  <h2>Test Taker Does Not Have a Valid Government-Issued ID<\/h2>\n  <p>Use when the test taker has no valid physical government-issued ID or presents an expired ID.<\/p>\n<\/div>\n\n<div class=\"content\">\n\n  <div class=\"flow-box\">STEP 1: Ask for another valid physical government-issued ID.<\/div>\n\n  <div class=\"action\">\n    <strong>Message to Test Taker<\/strong>\n    Please provide another valid government-issued ID. You must present a valid physical government-issued ID to test today.\n  <\/div>\n\n  <div class=\"branches\">\n    <div class=\"branch yes\">\n      <h4>YES — Has a Valid ID<\/h4>\n      Continue with the required check-in process.\n    <\/div>\n    <div class=\"branch no\">\n      <h4>NO — No Valid ID<\/h4>\n      Proceed to Step 2.\n    <\/div>\n  <\/div>\n\n  <div class=\"arrow\">↓<\/div>\n  <div class=\"flow-box\">STEP 2: Explain the cancellation and ask for confirmation.<\/div>\n\n  <div class=\"action\">\n    <strong>Message to Test Taker<\/strong>\n    If you do not have one available, please contact support@certiverse.com for further assistance. Unfortunately, we will need to cancel this session. Please confirm.\n  <\/div>\n\n  <h3>STEP 3: After the Test Taker Confirms<\/h3>\n  <ol>\n    <li>Take a screenshot of the chat history. Hide all personally identifiable information (PII).<\/li>\n    <li>Cancel the session using the appropriate reason from the dropdown, following the applicable cancellation procedure.<\/li>\n    <li>Post the session details in the APAC Team GC.<\/li>\n    <li>Follow the required Proctor Hub closure procedure.<\/li>\n  <\/ol>\n\n  <h3>APAC Team GC Format<\/h3>\n  <div class=\"template\">Test Taker Initial (Reservation Code)\nExam Name and Code\nReason | Exam Time<\/div>\n\n<\/div>\n<\/section>\n\n<!-- PROCESS 2: COMMON TO SEB AND NON-SEB -->\n<section data-platform=\"both\" data-flow=\"2\">\n<div class=\"section-title\">\n  <h2>Name on ID Does Not Match the Reservation<\/h2>\n  <p>Use when the name on the ID is misspelled or differs from the name on the exam reservation.<\/p>\n<\/div>\n\n<div class=\"content\">\n\n  <div class=\"flow-box\">STEP 1: Ask whether the test taker has another valid ID.<\/div>\n\n  <div class=\"action\">\n    <strong>Message to Test Taker<\/strong>\n    Do you have another valid government-issued ID?\n  <\/div>\n\n  <div class=\"branches\">\n    <div class=\"branch yes\">\n      <h4>YES — Has Another ID<\/h4>\n      Check the other ID. If the name matches the reservation and all requirements are met, continue check-in.\n    <\/div>\n    <div class=\"branch no\">\n      <h4>NO — No Other ID<\/h4>\n      Proceed to Step 2.\n    <\/div>\n  <\/div>\n\n  <div class=\"arrow\">↓<\/div>\n  <div class=\"flow-box\">STEP 2: Open the Name-Change Policy tab.<\/div>\n\n  <p>Check whether the client's exam policy allows a name change.<\/p>\n\n  <div class=\"branches\">\n    <div class=\"branch yes\">\n      <h4>YES — Name Change Allowed<\/h4>\n      <ol>\n        <li>Send the name-change message below.<\/li>\n        <li>Notify CS of the name-change request.<\/li>\n        <li>Wait for confirmation that the change is complete.<\/li>\n        <li>Refresh the dashboard and verify the updated name.<\/li>\n        <li>Inform the test taker and continue only when the requirements are met.<\/li>\n      <\/ol>\n    <\/div>\n\n    <div class=\"branch no\">\n      <h4>NO — Name Change Not Allowed<\/h4>\n      <ol>\n        <li>Send the cancellation message below.<\/li>\n        <li>Ask the test taker to confirm.<\/li>\n        <li>Take a screenshot with all PII hidden.<\/li>\n        <li>Request manual cancellation from CS or the Manager on Duty.<\/li>\n      <\/ol>\n    <\/div>\n  <\/div>\n\n  <div class=\"action\">\n    <strong>Message — Name Change Allowed<\/strong>\n    Unfortunately, that is not the name registered for this reservation. Per Certiverse rules, the name on your ID must fully match the exam reservation. To request a name change, please contact support@certiverse.com.\n  <\/div>\n\n  <div class=\"action\">\n    <strong>Message — Name Change Not Allowed<\/strong>\n    Unfortunately, that is not the name registered for this reservation. Per Certiverse rules, the name on your ID must fully match the exam reservation. We will need to cancel this session. Please email support@certiverse.com for assistance with rescheduling. Please confirm.\n  <\/div>\n\n  <h3>STEP 3: Report and Close<\/h3>\n  <ol>\n    <li>Notify CS and follow the instructions provided by CS or the Manager on Duty.<\/li>\n    <li>Post the session details in the APAC Team GC.<\/li>\n    <li>Close the session in Proctor Hub only when authorized.<\/li>\n  <\/ol>\n\n  <h3>APAC Team GC Format<\/h3>\n  <div class=\"template\">Test Taker Initial (Reservation Code)\nExam Name and Code\nReason | Exam Time<\/div>\n\n<\/div>\n<\/section>\n\n<!-- PROCESS 3: COMMON TO SEB AND NON-SEB -->\n<section data-platform=\"both\" data-flow=\"3\">\n<div class=\"section-title\">\n  <h2>Candidate Is Not in a Private Testing Area<\/h2>\n  <p>Use when the test taker cannot remain in a private testing area for the entire exam.<\/p>\n<\/div>\n\n<div class=\"content\">\n\n  <div class=\"flow-box\">STEP 1: Confirm that the test taker can stay in a private testing area.<\/div>\n\n  <div class=\"action\">\n    <strong>Message to Test Taker<\/strong>\n    You are required to be in a private testing area for the entire duration of the exam.\n  <\/div>\n\n  <div class=\"branches\">\n    <div class=\"branch yes\">\n      <h4>YES — Can Use a Private Area<\/h4>\n      Continue with the required check-in process.\n    <\/div>\n    <div class=\"branch no\">\n      <h4>NO — Cannot Use a Private Area<\/h4>\n      Proceed to Step 2.\n    <\/div>\n  <\/div>\n\n  <div class=\"arrow\">↓<\/div>\n  <div class=\"flow-box\">STEP 2: Explain cancellation and request confirmation.<\/div>\n\n  <div class=\"action\">\n    <strong>Message to Test Taker<\/strong>\n    Unfortunately, we will need to cancel this session. Please email support@certiverse.com for further assistance with rescheduling. Please confirm.\n  <\/div>\n\n  <h3>STEP 3: After Confirmation<\/h3>\n  <ol>\n    <li>Send: <strong>Thank you! You may close this session now.<\/strong><\/li>\n    <li>Notify CS or the Manager on Duty and request manual cancellation.<\/li>\n    <li>Keep the session open in Proctor Hub while waiting for confirmation and instructions.<\/li>\n    <li>Document all actions taken and relevant details.<\/li>\n    <li>Follow the instructions from CS/Manager on Duty before closing the Hub session.<\/li>\n    <li>Post the session details in the APAC Team GC.<\/li>\n  <\/ol>\n\n  <h3>Message to CS<\/h3>\n  <div class=\"template\">Test Taker / Exam Code:\nConcern:\nRequest:<\/div>\n\n  <h3>APAC Team GC Format<\/h3>\n  <div class=\"template\">Test Taker Initial (Reservation Code)\nExam Name and Code\nReason | Exam Time\n\nExample:\nA (8A8-D3F)\nHashiCorp Certified: Terraform Associate (004)\nReason for cancellation | 01:00 PM<\/div>\n\n<\/div>\n<\/section>\n\n<!-- SEB-SPECIFIC TROUBLESHOOTING -->\n\n\n<!-- PROCESS 4: NON-SEB BROWSER FLOW -->\n<section data-platform=\"non-seb\" data-flow=\"4\">\n<div class=\"section-title\">\n  <h2>Candidate Disconnects After the Exam Is Released<\/h2>\n  <p>Use when the candidate disconnects and does not immediately reconnect.<\/p>\n<\/div>\n\n<div class=\"content\">\n\n  <div class=\"flow-box\">STEP 1: Wait up to 20 minutes for the candidate to reconnect.<\/div>\n\n  <div class=\"branches\">\n    <div class=\"branch yes\">\n      <h4>YES — Candidate Reconnects<\/h4>\n      Continue the exam as required.\n    <\/div>\n    <div class=\"branch no\">\n      <h4>NO — Candidate Does Not Return<\/h4>\n      Notify CS and document all actions.\n    <\/div>\n  <\/div>\n\n  <h3>STEP 2: Notify Client Support<\/h3>\n  <div class=\"template\">Test Taker / Exam Code:\nConcern:\nRequest:<\/div>\n\n  <p>Follow the guidance provided by CS.<\/p>\n\n  <h3>STEP 3: Follow the Correct Path<\/h3>\n\n  <div class=\"branch no\">\n    <h4>If CS Confirms the Session Should End<\/h4>\n    END the session using the reason provided by CS.\n  <\/div>\n\n  <div class=\"branch yes\">\n    <h4>If AI-Assisted and There Is No Contact<\/h4>\n    If there is still no contact from the candidate or Support, keep the session open in Proctor Hub until the exam duration has ended. Then remove or close the session from Proctor Hub.\n  <\/div>\n\n<\/div>\n<\/section>\n\n<!-- PROCESS 5: NON-SEB BROWSER FLOW -->\n<section data-platform=\"non-seb\" data-flow=\"5\">\n<div class=\"section-title\">\n  <h2>Recurring Screen-Sharing Disconnections<\/h2>\n  <p>Use when screen sharing repeatedly stops during the exam.<\/p>\n<\/div>\n\n<div class=\"content\">\n\n  <div class=\"flow-box\">STEP 1: Ask the test taker to refresh the browser.<\/div>\n\n  <div class=\"action\">\n    <strong>Message to Test Taker<\/strong>\n    We are no longer able to hear or see you. Please refresh your browser and ensure your camera, microphone, and screen are being shared properly.\n  <\/div>\n\n  <div class=\"branches\">\n    <div class=\"branch yes\">\n      <h4>Issue Fixed<\/h4>\n      Proceed with or resume the exam.\n    <\/div>\n    <div class=\"branch no\">\n      <h4>Issue Continues<\/h4>\n      Proceed to Step 2.\n    <\/div>\n  <\/div>\n\n  <div class=\"arrow\">↓<\/div>\n  <div class=\"flow-box\">STEP 2: Relaunch the session.<\/div>\n\n  <p>Ask the test taker to use another supported browser and ensure no external monitors are connected.<\/p>\n\n  <div class=\"action\">\n    <strong>Message to Test Taker<\/strong>\n    It seems you are experiencing issues with your session. Please close this browser and relaunch your session from the exam dashboard.\n  <\/div>\n\n  <div class=\"branches\">\n    <div class=\"branch yes\">\n      <h4>Issue Fixed<\/h4>\n      Proceed with or resume the exam.\n    <\/div>\n    <div class=\"branch no\">\n      <h4>Issue Continues<\/h4>\n      Send the warning message below.\n    <\/div>\n  <\/div>\n\n  <h3>STEP 3: Send a Warning<\/h3>\n  <div class=\"action\">\n    <strong>Warning Message<\/strong>\n    We have noticed that your screen sharing has stopped multiple times. Please be advised that if this happens again, we may need to end your exam. Maintaining exam integrity is important to us.\n  <\/div>\n\n  <h3>STEP 4: If the Issue Happens Again<\/h3>\n  <ol>\n    <li>Document all actions taken and troubleshooting steps completed.<\/li>\n    <li>Notify CS using the template below.<\/li>\n    <li>Wait for CS confirmation before ending the session.<\/li>\n    <li>If CS confirms, END the session using the reason provided by CS.<\/li>\n    <li>Post the session details in the APAC Team GC.<\/li>\n  <\/ol>\n\n  <h3>Message to CS<\/h3>\n  <div class=\"template\">Test Taker / Exam Code:\nSession Type: AI\nIssue:\nTroubleshooting:\nOutcome:<\/div>\n\n  <h3>APAC Team GC Format<\/h3>\n  <div class=\"template\">Test Taker Initial (Reservation Code)\nExam Name and Code\nReason | Exam Time\n\nExample:\nA (8A8-D3F)\nHashiCorp Certified: Terraform Associate (004)\nTest taker technical issue | 01:00 PM<\/div>\n\n<\/div>\n<\/section>\n\n<\/main>\n\n<footer>\n  Internal Proctor Reference Guide | Follow current exam policies and escalation instructions.\n<\/footer>\n\n<\/body>\n<\/html>";
const primaryButtons = {
  seb: document.getElementById('sebTab'),
  nonseb: document.getElementById('nonSebTab'),
  misc: document.getElementById('miscTab'),
  process: document.getElementById('processTab')
};
const processFlowView = document.getElementById('processFlowView');
const processFlowFrame = document.getElementById('processFlowFrame');
const flowScroller = document.getElementById('flowScroller');
const FLOW_TABS = [
  ['1','No Valid Government-Issued ID'],
  ['2','Name Mismatch'],
  ['3','Not in a Private Testing Area'],
  ['4','Disconnects After the Exam Is Released'],
  ['5','Recurring Screen-Sharing Disconnections'],
  ['policy','Client Name-Change Policy']
];
let activeFlow = '1';
function buildFlowPills(){
  flowScroller.innerHTML = '';
  FLOW_TABS.forEach(([id,label]) => {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'cat-pill' + (id === activeFlow ? ' active' : '');
    pill.textContent = label;
    pill.addEventListener('click', () => { activeFlow = id; buildFlowPills(); showFlow(); });
    flowScroller.appendChild(pill);
  });
}
function showFlow(){
  const doc = processFlowFrame.contentDocument;
  if(!doc) return;
  const isPolicy = activeFlow === 'policy';
  const intro = doc.querySelector('.intro');
  const policy = doc.getElementById('client-policy-panel');
  if(intro) intro.style.display = isPolicy ? 'none' : '';
  if(policy) policy.hidden = !isPolicy;
  doc.querySelectorAll('section[data-flow]').forEach(section => {
    section.style.display = !isPolicy && section.dataset.flow === activeFlow ? '' : 'none';
  });
  const clientSearch = doc.getElementById('clientSearch');
  if(clientSearch && !clientSearch.dataset.ready){
    clientSearch.dataset.ready = '1';
    clientSearch.addEventListener('input', () => {
      const query = clientSearch.value.toLowerCase().trim();
      doc.querySelectorAll('#clientPolicyTable tbody tr').forEach(row => {
        row.hidden = !row.cells[0].textContent.toLowerCase().includes(query);
      });
    });
  }
  // Keep click-to-copy on process messages without altering their text.
  doc.querySelectorAll('.action, .template').forEach(card => {
    if(card.dataset.copyReady) return;
    const heading = card.querySelector('strong');
    const label = heading ? heading.textContent.toLowerCase() : '';
    if(!card.classList.contains('template') && !['message','warning','cancellation'].some(term => label.includes(term))) return;
    card.dataset.copyReady = '1';
    card.classList.add('copy-message');
    card.setAttribute('role','button');
    card.tabIndex = 0;
    const copy = () => {
      const clone = card.cloneNode(true);
      clone.querySelectorAll('strong').forEach(el => el.remove());
      const message = clone.innerText.trim();
      const fallback = () => {
        const ta = doc.createElement('textarea');
        ta.value = message; doc.body.appendChild(ta); ta.select();
        try { doc.execCommand('copy'); } catch(e) { window.prompt('Copy message:',message); }
        ta.remove();
      };
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(message).catch(fallback);
      else fallback();
      card.classList.add('copied');
      setTimeout(() => card.classList.remove('copied'),1800);
    };
    card.addEventListener('click',copy);
    card.addEventListener('keydown',e => {if(e.key === 'Enter' || e.key === ' '){e.preventDefault();copy();}});
  });
  processFlowFrame.contentWindow.scrollTo(0,0);
}
processFlowFrame.addEventListener('load',showFlow);
processFlowFrame.srcdoc = processFlowDocument;
function setMainView(view){
  activeMainTab = view;
  const isFlow = view === 'process';
  Object.entries(primaryButtons).forEach(([id,button]) => {
    button.classList.toggle('active',id === view);
    button.setAttribute('aria-selected',String(id === view));
  });
  document.getElementById('catScroller').style.display = isFlow ? 'none' : 'flex';
  flowScroller.style.display = isFlow ? 'flex' : 'none';
  document.getElementById('main').style.display = isFlow ? 'none' : '';
  processFlowView.style.display = isFlow ? 'block' : 'none';
  if(isFlow){buildFlowPills();showFlow();}
  else {activeCat = 'all';buildCatPills();render();}
}
Object.entries(primaryButtons).forEach(([id,button]) => button.addEventListener('click', () => setMainView(id)));

</script>

</body></html>
